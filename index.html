<!doctype html>
<html lang="de">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>DSC</title>
        <link rel="stylesheet" href="styles/style.css" />
        <link rel="stylesheet" href="styles/standard.css" />
    </head>
    <body>
        <section class="landing-section">
            <header>
                <img src="./assets/img/logo-img.svg" alt="Logo" />
            </header>
            <img class="hero-img" src="./assets/img/hero-img.png" alt="Leckere Gerichte" />
            <section class="title-section">
                <img src="./assets/img/rating-img.png" alt="Rating" />
                <div>
                    <h1><span class="orange-color">Burger</span>House</h1>
                    <p>The best of Burgers, Pizza, and Greens, all in one great place.</p>
                </div>
            </section>
        </section>

        <main>
            <img class="title-banner" src="./assets/img/title-banner-burger.png" alt="Titel-Banner" />
            <section class="content-section">
                <div class="meal-item">
                    <header>
                        <img src="./assets/img/order-img.png" alt="Leckere Speise" />
                        <h2 class="fs-24">Veggie mushroom black burger</h2>
                        <p class="fs-16">Chicken, Mozzarella, Gorgonzola, Fontina, Parmigiano Reggiano</p>
                    </header>
                    <footer>
                        <h2 class="fs-24">16,90 €</h2>
                        <button>Add to basket</button>
                    </footer>
                </div>
            </section>
        </main>
        <footer></footer>
    </body>
</html>
