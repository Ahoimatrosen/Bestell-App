<!doctype html>

<!-- font-sizes anpassen -->
<!-- font-styles anpassen -->
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>DSC</title>
        <link rel="stylesheet" href="./styles/style.css" />
        <link rel="stylesheet" href="./styles/standard.css" />
        <link rel="stylesheet" href="./styles/fonts.css" />
        <script defer src="./scripts/db.js"></script>
        <script defer src="scripts/script.js"></script>
        <script defer src="./scripts/templates.js"></script>
    </head>
    <body onload="renderOrderOptions()">
        <section class="landing_section">
            <header>
                <img src="./assets/img/logo-img.svg" alt="Bestell-App Logo" />
                <img src="./assets/img/burger-menu.png" alt="Burger-Menu" />
            </header>
            <img class="logo" src="./assets/img/burger-logo-img.png" alt="Burger Logo" />
        </section>
        <section class="title_section">
            <div class="title_section_title">
                <h1><span class="title_colored">Burger</span>House</h1>
                <div class="rating_box">
                    <img src="./assets/icons/star-icon.svg" alt="star-icon" />
                    <div>
                        <p class="rating_box_average">4,1</p>
                        <p class="rating_box_amount">(317)</p>
                    </div>
                </div>
            </div>
            <p class="title_section_slogan">The best of Burgers, Pizza, and Greens, all in one great place.</p>
        </section>
        <main>
            <aside class="basket">
                <h2 class="basket_title">Your Basket</h2>
                <div class="basket_item_container" id="order_basket_items"></div>
                <div class="basket_tables">
                    <table class="basket_checkout_table">
                        <tr>
                            <th>Subtotal</th>
                            <td>36,70€</td>
                        </tr>
                        <tr>
                            <th>Delivery Fee</th>
                            <td>4,99€</td>
                        </tr>
                    </table>
                    <div class="basket_item_table_seperator"></div>
                    <table class="basket_total_table">
                        <tr>
                            <th>Total</th>
                            <td>41,69€</td>
                        </tr>
                    </table>
                </div>
                <button class="basket_buy_button">Buy now (41, 69€)</button>
            </aside>
            <section id="order_options_section"></section>
        </main>

        <footer class="main_footer">
            <a href="#"><img src="./assets/icons/copyright-icon.png" alt="copyright-icon" />2025 BurgerHouse</a>
            <a href="#">Imprint</a>
            <a href="#">Cookie Preferences</a>
        </footer>
    </body>
</html>
