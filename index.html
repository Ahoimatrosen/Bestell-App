<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>DSC</title>
        <link rel="stylesheet" href="./styles/style.css" />
        <link rel="stylesheet" href="./styles/standard.css" />
        <link rel="stylesheet" href="./styles/fonts.css" />
        <link rel="stylesheet" href="./styles/basket.css" />
        <link rel="stylesheet" href="./styles/responsive.css" />
        <script defer src="./scripts/db.js"></script>
        <script defer src="scripts/script.js"></script>
        <script defer src="./scripts/templates.js"></script>
    </head>
    <body onload="renderOrderOptionSections()">
        <header class="main_header">
            <img class="header_logo" src="./assets/img/logo-img.svg" alt="Bestell-App Logo" />
            <img class="burger_menu" src="./assets/img/burger-menu.png" alt="Burger-Menu" />
        </header>
        <main>
            <section class="landing_section">
                <img class="logo" src="./assets/img/burger-logo-img.png" alt="Burger Logo" />
            </section>
            <section class="title_section">
                <div class="title_section_title">
                    <h1><span class="title_colored">Burger</span>House</h1>
                    <div class="rating_box">
                        <img src="./assets/icons/star-icon.svg" alt="star-icon" />
                        <div>
                            <p class="rating_box_average">4,1</p>
                            <p class="rating_box_amount">(317)</p>
                        </div>
                    </div>
                </div>
                <p class="title_section_slogan">The best of Burgers, Pizza, and Greens, all in one great place.</p>
            </section>
            <section class="basket_order_items_wrapper">
                <section class="order_options_section" id="order_options_section"></section>
                <aside id="basket" class="basket">
                    <header class="basket_header">
                        <button class="basket_closing_button" onclick="closeBasketOnMobile()">
                            <img src="./assets/img/dialog_close_button.png" alt="closing button" />
                        </button>
                        <h2 class="basket_title">Your Basket</h2>
                    </header>
                    <div id="order_basket_items" class="basket_item_container">
                        <div class="basket_preview">
                            <p>Nothing here yet. Go ahead and choose something delicious!</p>
                            <img src="./assets/img/basket-big.png" alt="basket" />
                        </div>
                    </div>
                    <div id="basket_checkout_table" class="basket_tables"></div>
                </aside>
            </section>
        </main>

        <footer class="main_footer">
            <a href="#"><img src="./assets/icons/copyright-icon.png" alt="copyright-icon" />2025 BurgerHouse</a>
            <a href="#">Imprint</a>
            <a href="#">Cookie Preferences</a>
        </footer>
        <nav id="mobileNavbar" class="mobile_navbar">
            <ul class="mobile_navbar_list">
                <li>
                    <button>
                        <a href="#">
                            <img src="./assets/icons/home-icon.png" alt="" />
                        </a>
                    </button>
                </li>
                <li>
                    <button><img src="./assets/icons/person-icon.png" alt="" /></button>
                </li>
                <li>
                    <button><img src="./assets/icons/orders-icon.png" alt="" /></button>
                </li>
                <li>
                    <button onclick="toggleBasketOnMobile()">
                        <img src="./assets/icons/shopping-cart-icon.png" alt="" />
                    </button>
                </li>
            </ul>
        </nav>
        <dialog id="checkout_dialog" class="checkout_dialog_overlay">
            <div class="checkout_dialog">
                <header>
                    <button onclick="closeCheckoutDialog()"><img src="./assets/img/dialog_close_button.png" alt="closing button" /></button>
                </header>
                <div class="checkout_dialog_content">
                    <img src="./assets/img/delivery-truck.png" alt="delivery truck" />
                    <h2>Order Confirmed!</h2>
                    <h3>Food is on your way!</h3>
                </div>
            </div>
        </dialog>
    </body>
</html>
